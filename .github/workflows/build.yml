name: Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -race ./...

      - name: Build Apple Silicon runner
        env:
          GOOS: darwin
          GOARCH: arm64
        run: make build

      - name: Upload runner
        uses: actions/upload-artifact@v7
        with:
          name: tartscaleset-darwin-arm64
          path: out/tartscaleset
          if-no-files-found: error
